x-api-environment: &api-environment
  Jwt__Secret: ${MYMO_JWT_SECRET:-mymo-dev-secret-key-change-me-32b!}
  Internal__Key: ${MYMO_INTERNAL_KEY:-mymo-local}
  Messaging__RabbitMq: amqp://mymo:${MYMO_RABBITMQ_PASSWORD:-mymo_rabbit_pass_123}@rabbitmq:5672
  Messaging__Kafka: kafka:9092
  Services__Identity: http://identity:5001
  Services__IdentityGrpc: http://identity:5011
  Services__Social: http://social:5002
  Services__Map: http://map:5003
  Services__Chat: http://chat:5004
  Services__Business: http://business:5005

x-upload-environment: &upload-environment
  Uploads__Directory: /app/uploads
  PublicOrigin: ${MYMO_PUBLIC_ORIGIN:-http://localhost:${MYMO_GATEWAY_PORT:-5079}}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mymo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  identity:
    build:
      context: .
      dockerfile: src/Mymo.Identity/Mymo.Identity.Api/Dockerfile.compose
    environment:
      <<: [*api-environment, *upload-environment]
      ConnectionStrings__Database: Server=sqlserver,1433;Database=mymo_identity;User Id=sa;Password=${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
    volumes:
      - uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  social:
    build:
      context: .
      dockerfile: src/Mymo.Social/Mymo.Social.Api/Dockerfile.compose
    environment:
      <<: [*api-environment, *upload-environment]
      ConnectionStrings__Database: Server=sqlserver,1433;Database=mymo_social;User Id=sa;Password=${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${MYMO_GEMINI_MODEL:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  map:
    build:
      context: .
      dockerfile: src/Mymo.Map/Mymo.Map.Api/Dockerfile.compose
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Server=sqlserver,1433;Database=mymo_map;User Id=sa;Password=${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  chat:
    build:
      context: .
      dockerfile: src/Mymo.Chat/Mymo.Chat.Api/Dockerfile.compose
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Server=sqlserver,1433;Database=mymo_chat;User Id=sa;Password=${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy

  business:
    build:
      context: .
      dockerfile: src/Mymo.Business/Mymo.Business.Api/Dockerfile.compose
    environment:
      <<: *api-environment
      ConnectionStrings__Database: Server=sqlserver,1433;Database=mymo_business;User Id=sa;Password=${MYMO_MSSQL_PASSWORD:-YourStrong@Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PROJECT: src/Mymo.Gateway/Mymo.Gateway.csproj
    command: [Mymo.Gateway.dll]
    environment:
      DOTNET_ENVIRONMENT: Docker
    ports:
      - "127.0.0.1:${MYMO_GATEWAY_PORT:-5079}:5079"
    depends_on:
      - identity
      - social
      - map
      - chat
      - business

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: mymo
      RABBITMQ_DEFAULT_PASS: ${MYMO_RABBITMQ_PASSWORD:-mymo_rabbit_pass_123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - mymo.social.post-created
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy

networks:
  default: {}

volumes:
  mssql-data:
  uploads:
