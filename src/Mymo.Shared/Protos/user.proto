syntax = "proto3";

option csharp_namespace = "Mymo.Shared.Protos";

package mymo;

// Service định nghĩa các RPC cho Identity / User
service UserGrpcService {
  // Lấy thông tin 1 user theo ID
  rpc GetUserById (GetUserByIdRequest) returns (UserGrpcReply);
  
  // Lấy danh sách nhiều user cùng lúc theo danh sách IDs
  rpc GetUsersBatch (GetUsersBatchRequest) returns (UsersBatchGrpcReply);
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUsersBatchRequest {
  repeated string user_ids = 1;
}

message UserGrpcReply {
  bool found = 1;
  string user_id = 2;
  string username = 3;
  string display_name = 4;
  string avatar_url = 5;
  bool is_online = 6;
  bool is_premium = 7;
  string role = 8;
}

message UsersBatchGrpcReply {
  repeated UserGrpcReply users = 1;
}
